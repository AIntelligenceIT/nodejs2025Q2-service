version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-library-app-dev
    ports:
      - "${APP_PORT:-4000}:${APP_PORT:-4000}"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./:/usr/src/app:delegated
      - /usr/src/app/node_modules
    command: npm run start:dev

networks:
  app-network:
    external: false
