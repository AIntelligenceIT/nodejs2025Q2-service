name: Build and Push Docker image

on:
  push:
    branches:
      # - main  # uruchamia się przy wypchnięciu do gałęzi 'main'
        - develop_part2
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z GitHuba
        uses: actions/checkout@v3

      - name: Zaloguj się do Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Zbuduj obraz Dockera
        # run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nodejs2025q2-service:latest .
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/node_library_part2_task-8:latest .
      - name: Wypchnij obraz na Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/nodejs2025q2-service:latest
